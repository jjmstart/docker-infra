---
- name: Install K3s server on control-plane node
  hosts: k3s_server_nodes
  become: true
  vars_files:
    - ../vault/secrets.yml   # 提供 k3s_token、registry_auth_*
  roles:
    - role: k3s-server
      tags: [k3s, k3s-server]

- name: Join K3s agents to cluster
  hosts: k3s_agent_nodes
  become: true
  vars_files:
    - ../vault/secrets.yml
  roles:
    - role: k3s-agent
      tags: [k3s, k3s-agent]