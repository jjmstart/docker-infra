---
# 幂等：k3s 已装且 systemd 服务 active 则跳过安装（与 v1.8 docker-daemon 能力探测同风格）。
- name: Check k3s server service state
  ansible.builtin.command: systemctl is-active k3s
  register: k3s_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set k3s_server_installed fact
  ansible.builtin.set_fact:
    k3s_server_installed: "{{ k3s_active.stdout | trim == 'active' }}"

# 在控制节点 bj-01 准备离线产物（二进制 + airgap 镜像包 + install.sh）。只在真实执行时运行：
# --check 不应下载大文件；缓存与具体节点无关，真实执行时始终保证存在，便于后续新增 agent 复用。
- name: Stage K3s airgap artifacts on control node
  ansible.builtin.include_role:
    name: k3s-airgap
  when: not ansible_check_mode

- name: Ensure /etc/rancher/k3s directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
  when: k3s_server_installed or not ansible_check_mode

# 私有 Registry 接入；含凭据，no_log。注意 registries.yaml 改动需重启 k3s 才生效（见 notify）。
- name: Render K3s registries.yaml
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0600"
  no_log: true
  notify: restart k3s server
  when: k3s_server_installed or not ansible_check_mode

# 离线产物分发：从控制节点缓存推到本节点（走 Tailscale）。下列 task 均守 not installed，
# 避免在已运行节点上覆盖二进制/镜像。二进制 → /usr/local/bin/k3s；airgap 镜像包 →
# agent/images/，k3s 首次启动时 containerd 自动导入，绕开不可达的 docker.io。
- name: Stage K3s binary to node
  ansible.builtin.copy:
    src: "{{ k3s_airgap_cache_dir }}/k3s"
    dest: /usr/local/bin/k3s
    mode: "0755"
  when:
    - not k3s_server_installed
    - not ansible_check_mode

- name: Ensure K3s airgap images dir exists
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/images
    state: directory
    mode: "0755"
  when:
    - not k3s_server_installed
    - not ansible_check_mode

- name: Stage K3s airgap images tarball to node
  ansible.builtin.copy:
    src: "{{ k3s_airgap_cache_dir }}/{{ k3s_airgap_images_filename }}"
    dest: "/var/lib/rancher/k3s/agent/images/{{ k3s_airgap_images_filename }}"
    mode: "0644"
  when:
    - not k3s_server_installed
    - not ansible_check_mode

- name: Ensure K3s install script dir exists
  ansible.builtin.file:
    path: "{{ k3s_install_script_path | dirname }}"
    state: directory
    mode: "0755"
  when:
    - not k3s_server_installed
    - not ansible_check_mode

- name: Stage K3s install script to node
  ansible.builtin.copy:
    src: "{{ k3s_airgap_cache_dir }}/install.sh"
    dest: "{{ k3s_install_script_path }}"
    mode: "0755"
  when:
    - not k3s_server_installed
    - not ansible_check_mode

# 离线安装：INSTALL_K3S_SKIP_DOWNLOAD=true 跳过一切下载，用预置二进制 + 本地 install.sh。
# INSTALL_K3S_EXEC 固定启动参数（决策 D1/D4）；token 来自 vault，no_log。
# --flannel-iface=tailscale0 是跨云走 Tailscale 的关键。
- name: Install K3s server (airgap, offline)
  ansible.builtin.shell: |
    INSTALL_K3S_SKIP_DOWNLOAD=true INSTALL_K3S_EXEC="server \
      --node-ip={{ k3s_server_host }} \
      --flannel-iface=tailscale0 \
      --disable=traefik \
      --write-kubeconfig-mode=0644 \
      --token={{ k3s_token }}" sh {{ k3s_install_script_path }}
  args:
    creates: /etc/systemd/system/k3s.service   # install.sh 生成的 unit；二进制已被预置故不能再用它当哨兵
  no_log: true
  when:
    - not k3s_server_installed
    - not ansible_check_mode

- name: Wait for k3s server to be active
  ansible.builtin.command: systemctl is-active k3s
  register: k3s_active_post
  until: k3s_active_post.stdout | trim == 'active'
  retries: 12
  delay: 5
  changed_when: false
  check_mode: false
  when: k3s_server_installed or not ansible_check_mode

# 把 kubeconfig 拉回 bj-01，并把 server: 127.0.0.1 改为 gz-05 Tailscale IP。
- name: Slurp kubeconfig from server
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_b64
  when: k3s_server_installed or not ansible_check_mode

- name: Ensure local kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: k3s_server_installed or not ansible_check_mode

- name: Write kubeconfig to bj-01 control node
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_b64.content | b64decode | regex_replace('127.0.0.1', k3s_server_host) }}"
    dest: "{{ lookup('env', 'HOME') }}/.kube/k3s-ruoyi.yaml"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: k3s_server_installed or not ansible_check_mode
