---
# ── Docker Engine 安装（v1.8 新增；官方 apt 仓库，codename 动态取）─────────────
- name: Check Docker CLI availability
  ansible.builtin.command: docker --version
  register: docker_cli_check
  changed_when: false
  check_mode: false
  failed_when: docker_cli_check.rc not in [0, 127]

- name: Install prerequisites for Docker apt repo
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
  when: docker_cli_check.rc != 0

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: docker_cli_check.rc != 0

- name: Check Docker official GPG key
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.asc
  register: docker_gpg_key
  when: docker_cli_check.rc != 0

- name: Add Docker official GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/ubuntu/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when:
    - docker_cli_check.rc != 0
    - not docker_gpg_key.stat.exists

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  when: docker_cli_check.rc != 0

# state=present：已装 docker-ce 的节点重复执行不会被升级（避免误触 daemon reload）。
- name: Install Docker Engine and compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: docker_cli_check.rc != 0

# Debian/Ubuntu 仓库内置的 python3-docker 版本可能落后于当前 Docker SDK，
# 先移除 apt 包，避免后续 pip 安装的 SDK 与系统包混用。
- name: Remove outdated python3-docker apt package
  ansible.builtin.apt:
    name: python3-docker
    state: absent

# pip 是安装 Python Docker SDK 的前置依赖；镜像源统一放在基础设施 role 中管理。
- name: Ensure python3-pip is installed
  ansible.builtin.apt:
    name: python3-pip
    state: present
    update_cache: false

- name: Configure pip mirror
  ansible.builtin.copy:
    dest: /etc/pip.conf
    mode: "0644"
    content: |
      [global]
      index-url = https://mirrors.aliyun.com/pypi/simple/
      trusted-host = mirrors.aliyun.com

# 清理 root 用户级 pip 配置，确保节点不会继续使用历史残留的失效镜像源。
- name: Remove root user-level pip config with stale mirror
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.pip/pip.conf
    - /root/.config/pip/pip.conf

- name: Check Python Docker SDK import
  ansible.builtin.command: python3 -c "import docker"
  register: docker_sdk_import
  changed_when: false
  check_mode: false
  failed_when: docker_sdk_import.rc not in [0, 1]

# Ansible 的 docker_compose_v2 等模块依赖 Python Docker SDK；已存在则不进 pip，避免 check mode 误报 changed。
# Python 3.11+ 节点需要显式允许写入系统 Python 环境。
- name: Install Python Docker SDK via pip
  ansible.builtin.pip:
    name: docker
    state: present
    extra_args: "{{ '--break-system-packages' if ansible_python_version is version('3.11', '>=') else '' }}"
  when: docker_sdk_import.rc != 0

- name: Ensure /etc/docker directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

# 通过模板合并写入 daemon.json，保留各云厂商节点的 mirror / DNS 差异配置。
- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: reload docker daemon

# ── global_gateway 网络（v1.8 新增；收编现有手工创建状态到 IaC）────────────────
# global_gateway 是各主机本地 bridge 网络（非跨主机 overlay），各节点独立创建。
# 使用 Docker CLI 避免 community.docker 在部分 requests/urllib3 组合下的 http+docker 兼容问题。
- name: Inspect global_gateway docker network
  ansible.builtin.command: "docker network inspect {{ docker_network_name }}"
  register: docker_network_inspect
  changed_when: false
  check_mode: false
  failed_when:
    - docker_network_inspect.rc != 0
    - "'not found' not in docker_network_inspect.stderr"

- name: Assert global_gateway docker network driver is bridge
  ansible.builtin.assert:
    that:
      - (docker_network_inspect.stdout | from_json | first).Driver == "bridge"
    fail_msg: "Existing {{ docker_network_name }} network is not bridge; refuse to recreate it automatically."
  when: docker_network_inspect.rc == 0

- name: Create global_gateway docker network
  ansible.builtin.command: "docker network create --driver bridge {{ docker_network_name }}"
  when:
    - docker_network_inspect.rc != 0
    - not ansible_check_mode
  changed_when: true

- name: Report global_gateway docker network would be created
  ansible.builtin.debug:
    msg: "Docker network {{ docker_network_name }} would be created with driver bridge."
  when:
    - docker_network_inspect.rc != 0
    - ansible_check_mode
  changed_when: true
